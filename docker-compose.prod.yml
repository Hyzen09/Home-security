services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-security-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: home-security-backend
    depends_on:
      - mosquitto
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - DB_PATH=/data/data.sqlite
    volumes:
      - backend-data:/data
    restart: unless-stopped

volumes:
  backend-data:
