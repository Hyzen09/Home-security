x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-security-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    container_name: home-security-backend
    depends_on:
      - mosquitto
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - DB_PATH=/data/data.sqlite
    volumes:
      - backend-data:/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backend-data:
