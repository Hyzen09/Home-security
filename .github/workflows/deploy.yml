name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "mosquitto/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/home-security
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:4000/health >/dev/null; then echo "backend healthy"; break; fi
              if [ "$i" = 20 ]; then echo "backend failed health check"; docker compose -f docker-compose.prod.yml logs --tail 50 backend; exit 1; fi
              sleep 3
            done
            docker image prune -f
            docker builder prune -f --filter until=72h
